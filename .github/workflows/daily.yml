name: Обновление DOG Монитора

on:
  schedule:
    - cron: '41 5 * * *'
    - cron: '11 11 * * *'
    - cron: '11 16 * * *'
    - cron: '41 20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full — полная сводка; wallets — средние цены кошельков; page — только страница; news — запись о запасах компаний; promo — картинка для X'
        default: full
        type: choice
        options: [full, wallets, page, news, promo]
      news:
        description: 'для news — JSON-массив записей'
        default: ''
        type: string
      debug:
        description: 'полный вывод в лог (лог публичный — после разбора удалить запуск)'
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: dogmon-daily
  cancel-in-progress: false

env:
  MODE: ${{ github.event.inputs.mode || 'full' }}
  DEBUG: ${{ github.event.inputs.debug || 'false' }}
  CI: python3 .engine/tools/quiet.py .engine/tools/ci.py

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Движок
        uses: actions/checkout@v5
        with:
          repository: dog-monitor/engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Адрес сайта
        run: $CI site-url

      - name: Данные
        if: env.MODE == 'full'
        run: $CI data

      - name: Средние цены кошельков
        if: env.MODE == 'full' || env.MODE == 'wallets'
        continue-on-error: true
        timeout-minutes: 12
        run: $CI cost

      - name: Индексы страха и жадности
        if: env.MODE == 'full' || env.MODE == 'wallets'
        continue-on-error: true
        timeout-minutes: 3
        run: $CI mood

      - name: Мем-монеты
        if: env.MODE == 'full' || env.MODE == 'wallets'
        continue-on-error: true
        timeout-minutes: 4
        run: $CI memes

      - name: Крупные кошельки
        if: env.MODE == 'full'
        continue-on-error: true
        timeout-minutes: 8
        run: $CI whales

      - name: Запасы компаний
        if: env.MODE == 'news'
        env:
          NEWS: ${{ github.event.inputs.news }}
        run: $CI news

      - name: Страница
        id: page
        if: env.MODE != 'news' && env.MODE != 'promo'
        continue-on-error: true
        timeout-minutes: 4
        run: $CI page

      - name: Автопроверка в браузере
        id: selfcheck
        if: env.MODE != 'news' && env.MODE != 'promo'
        continue-on-error: true
        timeout-minutes: 12
        run: $CI selfcheck

      - name: Картинка для X
        if: env.MODE == 'full' || env.MODE == 'promo'
        continue-on-error: true
        timeout-minutes: 8
        run: $CI promo

      - name: Утреннее сообщение
        if: env.MODE == 'full' || env.MODE == 'news'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: $CI message

      - name: Выкладка
        env:
          SELFCHECK: ${{ steps.selfcheck.outcome }}
        run: $CI publish

      - name: Проверка выкладки
        if: env.MODE == 'full'
        timeout-minutes: 12
        run: $CI livecheck

      - name: Итог автопроверки
        if: ${{ always() && steps.selfcheck.outcome == 'failure' }}
        run: |
          echo "::error::Автопроверка нашла проблемы — см. шаг «Автопроверка в браузере»"
          exit 1
