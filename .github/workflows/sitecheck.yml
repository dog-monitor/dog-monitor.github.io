name: Проверка живого сайта

# Живой сайт в Chrome (телефон, iPad, компьютер) и Safari (iPhone, iPad) — те же пункты, что перед выкладкой.
# Не прошло дважды — задача краснеет, и GitHub присылает письмо. В репозиторий ничего не пишет.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogmon-sitecheck
  cancel-in-progress: true

env:
  CI: python3 .engine/tools/quiet.py .engine/tools/ci.py

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Движок
        uses: actions/checkout@v5
        with:
          repository: dog-monitor/engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Адрес сайта
        run: $CI site-url

      - name: Живой сайт в браузере
        run: $CI selfcheck --live
