name: Проверка живого сайта

# Живой сайт в Chrome (телефон, iPad, компьютер) и Safari (iPhone, iPad) — те же пункты, что перед выкладкой.
# Не прошло дважды — задача краснеет, и GitHub присылает письмо. В репозиторий ничего не пишет.
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogmon-sitecheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Адрес сайта
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"; HOST="${OWNER,,}.github.io"
          if [ "${NAME,,}" = "$HOST" ]; then URL="https://$HOST/"; else URL="https://$HOST/$NAME/"; fi
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"; echo "Сайт: $URL"

      - name: Движок
        uses: actions/checkout@v5
        with:
          repository: dog-monitor/engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Живой сайт в браузере
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright-core@1.63.0 >/dev/null 2>&1 || npm i --no-audit --no-fund playwright-core@1 >/dev/null 2>&1
          npx --no-install playwright-core install --with-deps webkit >/dev/null 2>&1 || npx --no-install playwright-core install --with-deps webkit || true
          cd "$GITHUB_WORKSPACE"
          chk() { NODE_PATH="$RUNNER_TEMP/pw/node_modules" node .engine/tools/selfcheck.js . "$RUNNER_TEMP/selfcheck.json" --url "$SITE_URL"; }
          chk || { echo "::notice::не прошло — через минуту ещё раз"; sleep 60; chk; }

      - name: Итог по пунктам
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/selfcheck.json" <<'EOF' || true
          import json, sys
          d = json.load(open(sys.argv[1]))
          for i in d['items']:
              print(('OK   ' if i['ok'] else 'FAIL ') + i['t'] + ('' if i['ok'] or not i.get('d') else ' — ' + i['d']))
          print(f"{d['okN']} из {d['n']}")
          EOF
