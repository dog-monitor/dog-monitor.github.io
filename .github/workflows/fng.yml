name: Пульс сайта — индексы, сигнал о цене, сторожа

# Запускается снаружи каждые 15 минут (workflow_dispatch) и по запасному расписанию GitHub.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dogmon-fng
  cancel-in-progress: false

jobs:
  fng:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Адрес сайта
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"; HOST="${OWNER,,}.github.io"
          if [ "${NAME,,}" = "$HOST" ]; then URL="https://$HOST/"; else URL="https://$HOST/$NAME/"; fi
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"; echo "Сайт: $URL"

      - name: Сторожа
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AGE=$(python3 -c "import json,datetime as d;t=json.load(open('data/version.json'))['ts'];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()//60))")
          echo "сводке $AGE мин"
          if [ "$AGE" -gt 180 ]; then
            BUSY=$(gh run list --workflow daily.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "$BUSY" = "0" ]; then gh workflow run daily.yml --ref main -f mode=full && echo "запущена свежая сводка"; else echo "сводка уже идёт или ждёт очереди"; fi
          fi
          SC=$(gh run list --workflow sitecheck.yml --limit 1 --json createdAt,status --jq '.[0] | .createdAt + " " + .status')
          SCAGE=$(python3 -c "import sys,datetime as d;t=sys.argv[1];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(t.replace('Z','+00:00'))).total_seconds()//60) if t else 99999)" "${SC%% *}")
          echo "проверке живого сайта $SCAGE мин (${SC#* })"
          if [ "$SCAGE" -gt 110 ] && [ "${SC#* }" = "completed" ]; then gh workflow run sitecheck.yml --ref main && echo "запущена проверка живого сайта"; fi

      - name: Движок
        id: eng
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: dog-monitor/engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/cache/restore@v5
        with:
          path: .alert
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Сигнал о цене
        if: ${{ steps.eng.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_1H: '5'
          ALERT_24H: '10'
        run: mkdir -p .alert && python3 .engine/tools/quiet.py .engine/tools/alert.py .alert/state.json
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .alert
          key: alert-state-${{ github.run_id }}

      - name: Индексы страха и жадности
        id: mood
        if: ${{ steps.eng.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 .engine/tools/quiet.py .engine/tools/mood.py . 2>&1 | grep -E '^MOOD DOG|^ошибка'

      - name: Выкладка
        if: ${{ steps.mood.outcome == 'success' }}
        run: |
          WHAT=$(python3 - <<'EOF'
          import json, subprocess, datetime as d
          def key(x):
              if not isinstance(x, dict):
                  return None
              g = x.get('dog') or {}
              h = g.get('hist') or []
              h = h[:-1] + ([h[-1][:2]] if h else [])
              return json.dumps([g.get('v'), g.get('day'), g.get('parts'), g.get('facts'), g.get('prev'), h, g.get('turns'),
                                 (x.get('market') or {}).get('v'), (x.get('cmc') or {}).get('v')], sort_keys=True)
          def strip(x):
              if isinstance(x, dict): return {k: strip(v) for k, v in x.items() if k not in ('got', 'updated')}
              if isinstance(x, list): return [strip(v) for v in x]
              return x
          try: old = json.loads(subprocess.run(['git', 'show', 'HEAD:data/fng.json'], capture_output=True, text=True).stdout)
          except Exception: old = None
          new = json.load(open('data/fng.json'))
          if strip(old) == strip(new):
              print('same')
          elif key(old) != key(new):
              print('major')
          else:
              t = json.load(open('data/version.json')).get('fng')
              age = (d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(t.replace('Z', '+00:00'))).total_seconds() / 60 if t else 1e9
              print('minor' if age >= 30 else 'skip')
          EOF
          )
          echo "изменения: $WHAT"
          if [ "$WHAT" = same ] || [ "$WHAT" = skip ]; then git checkout -- data/fng.json; exit 0; fi
          python3 - <<'EOF'
          import json, datetime as d
          p = 'data/version.json'; v = json.load(open(p))
          v['fng'] = d.datetime.now(d.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(v, open(p, 'w'), ensure_ascii=False)
          EOF
          git config user.name "DOG Monitor bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fng.json data/version.json
          git commit -m "Страх и жадность (авто)"
          for i in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch --depth=20 origin main
            if ! git rebase origin/main; then
              git checkout --ours -- data/version.json 2>/dev/null || true
              git checkout --theirs -- data/fng.json 2>/dev/null || true
              git add data/version.json data/fng.json
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
            fi
          done
          exit 1
