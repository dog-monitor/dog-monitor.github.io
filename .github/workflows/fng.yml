name: Пульс сайта — индексы, сигнал о цене, сторожа

# Запускается снаружи каждые 15 минут (workflow_dispatch) и по запасному расписанию GitHub.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: dogmon-fng
  cancel-in-progress: false

env:
  CI: python3 .engine/tools/quiet.py .engine/tools/ci.py

jobs:
  fng:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Движок
        id: eng
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: dog-monitor/engine
          ssh-key: ${{ secrets.ENGINE_KEY }}
          path: .engine
          fetch-depth: 1
          persist-credentials: false

      - name: Адрес сайта
        if: ${{ steps.eng.outcome == 'success' }}
        run: $CI site-url

      - name: Сторожа
        if: ${{ steps.eng.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: $CI watch

      - uses: actions/cache/restore@v5
        with:
          path: .alert
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Сигнал о цене
        if: ${{ steps.eng.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: $CI alert
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .alert
          key: alert-state-${{ github.run_id }}

      - name: Индексы страха и жадности
        id: mood
        if: ${{ steps.eng.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: $CI mood

      - name: Выкладка
        if: ${{ steps.mood.outcome == 'success' }}
        run: $CI fng-publish
